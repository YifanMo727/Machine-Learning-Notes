<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深度学习笔记 · 总目录 | Deep Learning Notes Index</title>
<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --ink: #1f2430;
    --muted: #6b7280;
    --accent: #4f6df5;
    --accent-soft: #eef1fe;
    --border: #e5e8f0;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }

  header.hero {
    background: linear-gradient(135deg, #4f6df5 0%, #7c5cf0 100%);
    color: #fff;
    border-radius: var(--radius);
    padding: 36px 32px;
    margin-bottom: 28px;
  }
  .hero .course { font-size: 13px; opacity: .85; letter-spacing: .5px; margin-bottom: 8px; }
  .hero h1 { font-size: 28px; line-height: 1.35; }
  .hero .en-title { font-size: 16px; font-weight: 400; opacity: .9; margin-top: 6px; }
  .hero .stats { margin-top: 14px; font-size: 13px; background: rgba(255,255,255,.15); padding: 6px 14px; border-radius: 8px; display: inline-block; }

  h2.week {
    font-size: 18px;
    margin: 30px 0 14px;
    padding-left: 12px;
    border-left: 4px solid var(--accent);
  }
  h2.week .en { color: var(--muted); font-weight: 500; font-size: 14px; margin-left: 8px; }

  .lesson {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 22px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    box-shadow: 0 1px 3px rgba(30, 40, 90, .05);
    transition: transform .12s, box-shadow .12s;
  }
  .lesson:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(30,40,90,.08); }
  .lesson .code {
    background: var(--accent-soft); color: var(--accent);
    font-size: 12.5px; font-weight: 700;
    padding: 4px 10px; border-radius: 8px;
    font-family: "SF Mono", Consolas, monospace;
    white-space: nowrap;
  }
  .lesson .titles { flex: 1; min-width: 200px; }
  .lesson .zh { font-weight: 700; font-size: 15.5px; }
  .lesson .en { color: var(--muted); font-size: 13px; }
  .lesson .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .lesson .links a {
    text-decoration: none;
    font-size: 13px;
    padding: 5px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--ink);
    transition: all .15s;
    white-space: nowrap;
  }
  .lesson .links a:hover { border-color: var(--accent); color: var(--accent); }
  .lesson .links a.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .lesson .links a.primary:hover { opacity: .88; }

  .upcoming {
    border-style: dashed;
    opacity: .65;
    box-shadow: none;
  }
  .upcoming:hover { transform: none; box-shadow: none; }
  .upcoming .code { background: #f1f3f9; color: var(--muted); }

  footer { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 48px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="course">Andrew Ng · Deep Learning Specialization · Course 1: Neural Networks and Deep Learning</div>
    <h1>深度学习笔记 · 总目录</h1>
    <div class="en-title">Bilingual Study Notes Index · 中英双语复习笔记</div>
    <div class="stats" id="stats"></div>
  </header>

  <h2 class="week">Week 1 · 深度学习简介 <span class="en">Introduction to Deep Learning</span></h2>
  <div id="week1"></div>

  <h2 class="week">Week 2 · 神经网络基础 <span class="en">Basics of Neural Network Programming</span></h2>
  <div id="week2"></div>

  <footer>笔记随课程进度持续更新 · 打开各讲「复习页面」可使用名词卡片自测模式</footer>
</div>

<script>
  // ── 在这里添加新课程即可,页面自动渲染 ──
  // done: true = 已有笔记;false = 待学习(灰色占位,可删可留)
  const lessons = {
    week1: [
      { code: "C1W1L02", zh: "什么是神经网络?", en: "What is a Neural Network?", video: "https://www.youtube.com/watch?v=n1l-9lIMW7E", html: "C1W1L02_复习页面.html", md: "C1W1L02_什么是神经网络_笔记.md", done: true },
      { code: "C1W1L03", zh: "用神经网络做监督学习", en: "Supervised Learning with a Neural Network", video: "https://www.youtube.com/watch?v=BYGpKPY9pO0", html: "C1W1L03_复习页面.html", md: "C1W1L03_用神经网络做监督学习_笔记.md", done: true },
      { code: "C1W1L04", zh: "为什么深度学习会兴起?", en: "Why is Deep Learning Taking Off?", video: "https://www.youtube.com/watch?v=xflCLdJh0n0", html: "C1W1L04_复习页面.html", md: "C1W1L04_为什么深度学习会兴起_笔记.md", done: true },
    ],
    week2: [
      { code: "C1W2L01", zh: "二分类", en: "Binary Classification", video: "https://www.youtube.com/watch?v=eqEc66RFY0I", html: "C1W2L01_复习页面.html", md: "C1W2L01_二分类_笔记.md", done: true },
      { code: "C1W2L02", zh: "逻辑回归", en: "Logistic Regression", video: "https://www.youtube.com/watch?v=hjrYrynGWGA", html: "C1W2L02_复习页面.html", md: "C1W2L02_逻辑回归_笔记.md", done: true },
      { code: "C1W2L03", zh: "逻辑回归的成本函数", en: "Logistic Regression Cost Function", video: "https://www.youtube.com/watch?v=SHEPb1JHw5o", html: "C1W2L03_复习页面.html", md: "C1W2L03_成本函数_笔记.md", done: true },
      { code: "C1W2L04", zh: "梯度下降", en: "Gradient Descent", video: "https://www.youtube.com/watch?v=uJryes5Vk1o", html: "C1W2L04_复习页面.html", md: "C1W2L04_梯度下降_笔记.md", done: true },
      { code: "C1W2L05", zh: "导数(直觉)", en: "Derivatives", video: "https://www.youtube.com/watch?v=GzphoJOVEcE", html: "C1W2L05_复习页面.html", md: "C1W2L05_导数_笔记.md", done: true },
      { code: "C1W2L06", zh: "更多导数例子", en: "More Derivative Examples", video: "https://www.youtube.com/watch?v=5H7M5Vd3-pk", html: "C1W2L06_复习页面.html", md: "C1W2L06_更多导数例子_笔记.md", done: true },
      { code: "C1W2L07", zh: "计算图", en: "Computation Graph", video: "https://www.youtube.com/watch?v=hCP1vGoCdYU", html: "C1W2L07_复习页面.html", md: "C1W2L07_计算图_笔记.md", done: true },
      { code: "C1W2L08", zh: "用计算图求导", en: "Derivatives With Computation Graphs", video: "https://www.youtube.com/watch?v=nJyUyKN-XBQ", html: "C1W2L08_复习页面.html", md: "C1W2L08_用计算图求导_笔记.md", done: true },
      { code: "C1W2L09", zh: "逻辑回归的梯度下降", en: "Logistic Regression Gradient Descent", video: "https://www.youtube.com/watch?v=z_xiwjEdAC4", html: "C1W2L09_复习页面.html", md: "C1W2L09_逻辑回归的梯度下降_笔记.md", done: true },
      { code: "C1W2L10", zh: "m 个样本的梯度下降", en: "Gradient Descent on m Examples", video: "https://www.youtube.com/watch?v=KKfZLXcF-aE", html: "C1W2L10_复习页面.html", md: "C1W2L10_m个样本的梯度下降_笔记.md", done: true },
      { code: "C1W2L11", zh: "向量化", en: "Vectorization", video: "", html: "", md: "", done: false },
    ],
  };

  function render(containerId, list) {
    const el = document.getElementById(containerId);
    el.innerHTML = list.map(l => {
      if (!l.done) {
        return `<div class="lesson upcoming">
          <span class="code">${l.code}</span>
          <div class="titles"><div class="zh">${l.zh}</div><div class="en">${l.en} · 待学习</div></div>
        </div>`;
      }
      return `<div class="lesson">
        <span class="code">${l.code}</span>
        <div class="titles"><div class="zh">${l.zh}</div><div class="en">${l.en}</div></div>
        <div class="links">
          <a class="primary" href="${l.html}">复习页面</a>
          <a href="${l.md}">Markdown</a>
          <a href="${l.video}" target="_blank">视频 ▶</a>
        </div>
      </div>`;
    }).join("");
  }
  render("week1", lessons.week1);
  render("week2", lessons.week2);
  const doneCount = [...lessons.week1, ...lessons.week2].filter(l => l.done).length;
  document.getElementById("stats").textContent = `已完成 ${doneCount} 讲笔记 · 持续更新中`;
</script>
</body>
</html>
